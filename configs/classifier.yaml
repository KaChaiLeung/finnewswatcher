# Classifier rules for FinNewsWatcher
# - headline_weight, snippet_weight: scoring weights
# - min_total_hits, min_headline_hits: classification thresholds
# - disqualify_if_negative: if any negative keyword (global or class-level) hits, skip that class
# - negative_keywords_global: applied for all classes
# - priority_order: tie-breaker order (earlier wins)
# - classes: per-class keyword lists (all lowercase; exact/word-boundary matching happens in code)

# --- Scoring knobs ---
headline_weight: 2
snippet_weight: 1
min_total_hits: 1
min_headline_hits: 0
disqualify_if_negative: true

# --- Global negatives (filter out opinion/thinkpieces etc.) ---
negative_keywords_global:
  - opinion
  - column
  - explainer
  - newsletter
  - podcast
  - interview
  - q&a
  - guest post
  - live blog
  - live updates
  - recap
  - roundup
  - analysis
  - rumor
  - rumours
  - reportedly
  - speculation
  - speculative
  - preview

# --- Tie-break priority (earlier wins on ties) ---
priority_order:
  - "M&A"
  - "Guidance"
  - "Earnings"
  - "Legal-Reg"
  - "Financing"
  - "Exec"
  - "Product-Customer"
  - "Macro"

