[project]
name = "finnewswatcher"
version = "0.1.0"
description = "Watchlist-based financial news digest with materiability scoring and LLM auto-eval"
authors = [
    {name = "Ka Chai Leung",email = "kachaileung1211@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "feedparser (>=6.0.11,<7.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "pendulum (>=3.1.0,<4.0.0)",
    "rapidfuzz (>=3.13.0,<4.0.0)",
    "slack-sdk (>=3.36.0,<4.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.8"
pytest = "^8.4.1"
mypy = "^1.17.1"
types-pyyaml = "^6.0.12.20250809"

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true